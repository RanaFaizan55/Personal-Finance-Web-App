<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Hub | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand auth-brand">
          <div class="brand-mark">L</div>
          <div>
            <p class="eyebrow">Security</p>
            <h1>Life Hub</h1>
          </div>
        </div>

        <h2>Reset password</h2>
        <p class="auth-subtitle">Update your account password securely.</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('reset_password') }}" class="auth-form">
          <label>
            <span>Username</span>
            <input type="text" name="username" placeholder="Enter your username" required />
          </label>
          <label>
            <span>Current password</span>
            <input type="password" name="current_password" placeholder="Enter current password" required />
          </label>
          <label>
            <span>New password</span>
            <input type="password" name="new_password" placeholder="Create new password" required />
          </label>
          <label>
            <span>Confirm new password</span>
            <input type="password" name="confirm_password" placeholder="Repeat new password" required />
          </label>
          <button type="submit">Update password</button>
        </form>

        <p class="auth-switch">
          Back to
          <a href="{{ url_for('login') }}">Login</a>
        </p>
      </div>
    </div>
  </body>
</html>
